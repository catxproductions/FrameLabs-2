name: FrameLabs 2 checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Syntax and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install C++ WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld

      - name: Build C++ physics kernel and run syntax/regression tests
        run: npm run check

      - name: Commit generated Wasm artifact to the branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/physics-core.wasm
          if git diff --cached --quiet; then
            echo "Wasm artifact is already up to date."
            exit 0
          fi
          git commit -m "Build C++ physics WebAssembly artifact"
          git push origin "HEAD:${GITHUB_REF_NAME}"
